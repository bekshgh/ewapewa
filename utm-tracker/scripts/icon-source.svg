    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#5290BD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5290BD" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g transform="translate(70 78) scale(0.73)">
