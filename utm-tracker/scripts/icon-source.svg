      <ellipse cx="150" cy="148" rx="48" ry="70" transform="rotate(8 150 148)"/>
      <ellipse cx="266" cy="140" rx="48" ry="64" transform="rotate(16 266 140)"/>
      <ellipse cx="354" cy="228" rx="44" ry="60" transform="rotate(24 354 228)"/>
      <ellipse cx="430" cy="326" rx="42" ry="58" transform="rotate(28 430 326)"/>
